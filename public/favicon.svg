<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Disciplina que Dá Dinheiro">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#20F27B" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#05070B" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#g)" stroke-width="2" opacity=".55" />
  <!-- grade de constancia: 3 dias cumpridos e 1 em aberto -->
  <rect x="15" y="15" width="14" height="14" rx="4" fill="#8B5CF6" />
  <rect x="35" y="15" width="14" height="14" rx="4" fill="#8B5CF6" opacity=".55" />
  <rect x="15" y="35" width="14" height="14" rx="4" fill="#20F27B" opacity=".85" />
  <rect x="35" y="35" width="14" height="14" rx="4" fill="none" stroke="#8B5CF6" stroke-width="2" opacity=".5" />
