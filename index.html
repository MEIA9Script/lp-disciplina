            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O acesso é liberado no e-mail cadastrado assim que o pagamento é confirmado pela plataforma."
            }
          },
          {
            "@type": "Question",
            "name": "Isso é promessa de ganho rápido?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O material ensina método e rotina de execução. O resultado depende da aplicação de cada pessoa e nenhum ganho é garantido."
            }
          },
          {
            "@type": "Question",
            "name": "Qual a diferença entre o material inicial e o completo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O inicial, por R$ 10,00, trabalha a base e traz o desafio de 7 dias. O completo, por R$ 34,90, tem tudo isso mais a parte prática que leva ao primeiro cliente, com serviços, preços, scripts, proposta e o plano de 30 dias."
